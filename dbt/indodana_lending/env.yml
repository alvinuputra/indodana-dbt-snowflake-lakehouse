# Environment variables for dbt Projects on Snowflake.
#
# Every key must be UPPERCASE and prefixed with DBT_ — Snowflake enforces
# this and the run fails otherwise.
#
# Values may be plain text or SQL returning one row / one VARCHAR column.
# Resolving the role from CURRENT_ROLE() keeps the project portable: it
# runs under whatever role invoked it, with nothing account-specific
# committed to the repository.

env_config:
  default_environment: dev

  environments:
    - name: dev
      env:
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"

    - name: prod
      env:
        # Pin this to your production role rather than inheriting the
        # caller's, so a scheduled task cannot silently run as whoever
        # happened to trigger it.
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
